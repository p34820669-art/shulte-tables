<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#2f4fb3" />
  <title>Таблицы Шульте</title>
  <style>
    @font-face { font-family: 'Neuronus'; font-weight: 400; font-display: block;
      src: url('./fonts/Neuronus-Regular.ttf') format('truetype'); }
    @font-face { font-family: 'Nunito'; font-weight: 900; font-display: block;
      src: url('./fonts/nunito-latin-900-normal.woff2') format('woff2');
      unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+2000-206F, U+2074, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }
    @font-face { font-family: 'Rubik'; font-weight: 400; font-display: block;
      src: url('./fonts/rubik-cyrillic-400-normal.woff2') format('woff2');
      unicode-range: U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116; }
    @font-face { font-family: 'Rubik'; font-weight: 400; font-display: block;
      src: url('./fonts/rubik-latin-400-normal.woff2') format('woff2');
      unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+2000-206F, U+2074, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }
    @font-face { font-family: 'Rubik'; font-weight: 600; font-display: block;
      src: url('./fonts/rubik-cyrillic-600-normal.woff2') format('woff2');
      unicode-range: U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116; }
    @font-face { font-family: 'Rubik'; font-weight: 600; font-display: block;
      src: url('./fonts/rubik-latin-600-normal.woff2') format('woff2');
      unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+2000-206F, U+2074, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }
    html, body { margin: 0; height: 100%; overflow: hidden; background: linear-gradient(#2a46a8, #a98bd6); overscroll-behavior: none; }
    #game { position: fixed; inset: 0; touch-action: none; -webkit-tap-highlight-color: transparent; user-select: none; }
    canvas { display: block; }
  </style>
</head>
<body>
  <div id="game"></div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
